<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c1311">
  <title>Einladung · ATM10 Campus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230c1311'/><rect x='2.5' y='2.5' width='11' height='11' rx='2.5' fill='%237ee0a8'/><rect x='5.5' y='5.5' width='5' height='5' rx='1' fill='%23091d14'/></svg>">
  <link rel="stylesheet" href="/assets/campus-tokens.css?v=20261125-overhaul-1">
  <link rel="stylesheet" href="/assets/app.css?v=20261125-overhaul-1">
  <style>
    body.auth-page {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(126, 224, 168, 0.12), transparent 68%),
        radial-gradient(circle at 82% 88%, rgba(242, 190, 107, 0.06), transparent 46%),
        var(--bg);
    }

    main.auth-shell {
      min-height: 100dvh;
      max-width: none;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .auth-card {
      width: min(440px, 100%);
      padding: 30px 28px 26px;
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      font-size: 1rem;
      font-weight: 720;
      letter-spacing: -0.015em;
      color: var(--text);
    }

    .auth-brand::before {
      content: none;
    }

    .auth-card h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .auth-status {
      margin: 14px 0 0;
    }

    .auth-fields {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .auth-field {
      display: grid;
      gap: 6px;
    }

    .auth-field label {
      margin: 0;
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-2);
    }

    .auth-field .c-input {
      width: 100%;
      min-height: 42px;
    }

    .auth-submit {
      width: 100%;
      min-height: 42px;
      margin-top: 6px;
    }

    .auth-error {
      margin: 16px 0 0;
    }

    .auth-error:empty {
      display: none;
    }

    .auth-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 550;
    }

    .auth-footer a:hover {
      color: var(--accent-strong);
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .auth-card {
        padding: 24px 20px 22px;
      }
    }
  </style>
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Zum Inhalt</a>
  <main id="main" class="auth-shell">
    <form class="auth-card" id="f">
      <div class="auth-brand">
        <svg width="24" height="24" viewBox="0 0 20 20" aria-hidden="true">
          <rect width="20" height="20" rx="5" fill="#182a22" stroke="#4c745f" stroke-width="1.2"/>
          <rect x="4" y="4" width="12" height="12" rx="2.5" fill="#7ee0a8"/>
          <rect x="7.5" y="7.5" width="5" height="5" rx="1" fill="#091d14"/>
        </svg>
        <span>ATM10 Campus</span>
      </div>
      <h1>Einladung annehmen</h1>
      <div id="info" class="c-notice auth-status" role="status">Einladung wird geprüft …</div>

      <div id="fields" class="auth-fields hide">
        <div class="auth-field">
          <label for="u">Benutzername (gern dein MC-Name)</label>
          <input id="u" class="c-input" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+">
        </div>
        <div class="auth-field">
          <label for="p">Passwort (mind. 10 Zeichen)</label>
          <input id="p" class="c-input" type="password" autocomplete="new-password" required minlength="10">
        </div>
        <button id="submitBtn" class="c-btn c-btn--primary auth-submit" type="submit">Account anlegen</button>
      </div>

      <p id="e" class="c-notice c-notice--danger auth-error" role="alert"></p>

      <div class="auth-footer">
        <a href="/login">&larr; Zum Login</a>
        <a href="/docs">API-Dokumentation &rarr;</a>
      </div>
    </form>
  </main>
  <script>
    const f = document.getElementById('f');
    const info = document.getElementById('info');
    const fields = document.getElementById('fields');
    const u = document.getElementById('u');
    const p = document.getElementById('p');
    const e = document.getElementById('e');
    const submitBtn = document.getElementById('submitBtn');
    const code = location.pathname.split('/').pop();

    fetch('/api/auth/invite/' + encodeURIComponent(code))
      .then((r) => r.json())
      .then((j) => {
        if (!j.valid) {
          info.className = 'c-notice c-notice--danger auth-status';
          info.textContent = 'Diese Einladung ist ungültig, abgelaufen oder schon benutzt.';
          return;
        }
        info.className = 'c-notice c-notice--ok auth-status';
        info.textContent = j.role === 'admin' ? 'Du wirst Admin des Campus.' : 'Leg dir einen Account für den Campus an.';
        fields.classList.remove('hide');
        u.focus();
      })
      .catch(() => {
        info.className = 'c-notice c-notice--danger auth-status';
        info.textContent = 'Einladung konnte gerade nicht geprüft werden.';
      });

    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      e.textContent = '';
      submitBtn.disabled = true;
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-campus-csrf': '1' },
          body: JSON.stringify({ code, username: u.value, password: p.value }),
        });
        if (r.ok) {
          location.href = '/erebor/dashboard';
          return;
        }
        const data = await r.json().catch(() => null);
        e.textContent = data?.error || 'Fehlgeschlagen.';
      } catch {
        e.textContent = 'Verbindung zum Server fehlgeschlagen.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
