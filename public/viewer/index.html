<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus-Viewer · ATM10</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' rx='3' fill='%2373d8e5'/></svg>">
<link rel="stylesheet" href="/viewer/viewer.css?v=20261101-polish-1">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.min.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="/assets/blueprint-preview.css?v=20261101-polish-1"></head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D-Ansicht des Campus"></canvas>

<div id="loading" class="loading">

  <div class="loading-card">
    <div class="brand">ATM10 Campus</div>
    <h1>3D-Ansicht laden</h1>
    <p id="loading-step">Lade Szene …</p>
    <div class="bar"><div id="loading-bar"></div></div>
  </div>
</div>

<header class="topbar glass">
  <a class="brand" href="/app" title="Zur Übersicht"><span class="brand-text">ATM10 Campus</span><span class="brand-short">Campus</span></a>
  <div class="snap">
    <span id="live-badge" class="badge">–</span>
    <label class="select"><span class="sr">Snapshot</span><select id="snapshot"></select></label>
  </div>
  <div id="edition" class="edition"></div>
  <div class="viewer-refresh"><span id="refresh-label" role="status">Prüfung in 30 s</span><button id="refresh-now" type="button" class="tool-btn">Jetzt prüfen</button><progress id="refresh-progress" max="1" value="0" aria-label="Zeit bis zur nächsten Aktualisierung"></progress></div>
  <nav class="links">
    <a href="/app">Baupläne</a><a href="/app#cannons">Kanonen</a>
  </nav>
  <button id="panel-toggle" class="icon-btn mobile-only" aria-label="Ansicht und Baupläne öffnen" aria-expanded="false" aria-controls="panel">Ansicht</button>
</header>

<aside id="panel" class="panel glass">
  <div class="tabs" aria-label="Viewer-Bereiche">
    <button data-tab="view" class="active" aria-pressed="true">Ansicht</button>
    <button data-tab="blueprints" aria-pressed="false">Baupläne <span id="bp-count" class="count"></span></button>
    <button data-tab="places" aria-pressed="false">Orte</button>
  </div>
  <section data-pane="view" class="pane active">
    <h3>Ansichten</h3>
    <div id="presets" class="presets"></div>
    <details class="viewer-disclosure"><summary>Ebenen anpassen</summary>
    <div id="layers" class="layers"></div>
    <label class="check"><input type="checkbox" id="overlap"> Überlappungen hervorheben <span id="overlap-count" class="count"></span></label></details>
    <details class="viewer-disclosure"><summary>Darstellung</summary>  <label class="slider" title="Tageszeit">
    <span>Zeit <b id="tod-val">15:30</b></span>
    <input id="tod" type="range" min="0" max="24" step="0.25" value="15.5">
  </label>
  <div class="seg small">
    <button id="t-shadows" class="active" title="Schatten">Schatten</button>
    <button id="t-bloom" class="active" title="Leuchten">Glow</button>
    <button id="t-grid" class="active" title="Raster">Raster</button>
  </div>
</details>
  </section>
  <section data-pane="blueprints" class="pane">
    <div class="bp-tools">
      <input id="bp-search" type="search" aria-label="Bauplan suchen" placeholder="Bauplan suchen …" autocomplete="off">
      <button id="bp-all" class="chip">Alle</button>
      <button id="bp-none" class="chip">Keine</button>
    </div>
    <div class="bp-actions">
      <button id="bp-materials" class="chip" title="Was fehlt noch – für alle sichtbaren Baupläne">Materialliste (sichtbare)</button>
      <a id="bp-rest-zip" class="chip" href="/api/remaining.zip" download title="Nur die fehlenden Blöcke als NBT je Bauplan, für die Schematicannon">Rest-NBTs (ZIP)</a>
    </div>
    <div class="bp-filter" id="bp-filter"></div>
    <div id="bp-list" class="bp-list"></div>
  </section>
  <section data-pane="places" class="pane">
    <div id="pois" class="pois"></div>
  </section>
</aside>

<div id="detail" class="detail glass hidden"></div>

<div id="materials" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mat-title">
  <div class="modal-card glass">
    <header class="mat-head">
      <div><h2 id="mat-title">Materialliste</h2><div id="mat-sub" class="sub"></div></div>
      <button class="close" data-close aria-label="Schließen">✕</button>
    </header>
    <div id="mat-summary" class="mat-summary"></div>
    <div class="mat-tools">
      <input id="mat-search" type="search" aria-label="Material suchen" placeholder="Item suchen …" autocomplete="off">
      <label class="check"><input type="checkbox" id="mat-built"> Gebautes zeigen</label>
    </div>
    <div id="mat-body" class="mat-body"></div>
    <footer class="mat-foot">
      <div class="mat-opts">
        <label class="check" title="Nur für den Vanilla-Strukturblock: Luft-Zellen reißen dort ab. Die Schematicannon ignoriert Luft im normalen Modus; im Modus „Replace Solid with Empty“ würde sie alles leer räumen, was nicht in der Datei steht."><input type="checkbox" id="mat-clear"> Abriss mitnehmen (nur Strukturblock)</label>
        <label class="check" title="Zellen, in denen eine Maschine/Kiste steht, auslassen, damit die Schematicannon sie nicht zerstört"><input type="checkbox" id="mat-skip-blocked" checked> Maschinen-Zellen auslassen</label>
      </div>
      <div class="actions">
        <button id="mat-copy">Als Text kopieren</button>
        <a id="mat-csv" href="#" download>CSV</a>
        <a id="mat-rest" href="#" class="primary" download title="Nur fehlende Blöcke, gleicher Ankerpunkt wie der volle Bauplan. Schematicannon im normalen Modus verwenden.">Rest-NBT laden</a>
      </div>
    </footer>
  </div>
</div>

<div class="toolbar glass">
  <div class="seg" id="nav-mode" role="group" aria-label="Navigation">
    <button data-mode="orbit" class="active" title="Orbit: ziehen dreht, rechts/2-Finger verschiebt, Rad zoomt">Orbit</button>
    <button data-mode="fly" title="Fliegen: WASD, Leertaste/E hoch, Q runter, Shift schnell, ziehen schaut">Fliegen</button>
    <button data-mode="walk" title="Laufen: WASD, Leertaste springt, Shift sprintet, ziehen schaut">Laufen</button>
  </div>
  <label class="slider" title="Schnitt in Y-Höhe: alles darüber ausblenden">
    <span>Schnitt <b id="clip-val">aus</b></span>
    <input id="clip" type="range" min="0" max="1" step="1">
  </label>
  <button id="reset-cam" class="tool-btn" title="Kamera zurücksetzen">Zurücksetzen</button>
  <button id="shot" class="tool-btn" title="Screenshot speichern">Bild speichern</button>
</div>

<div id="tooltip" class="tooltip hidden"></div>
<div id="hud" class="hud"></div>
<div id="toast" class="toast hidden"></div>

<script type="module" src="/viewer/main.js?v=20261101-polish-1"></script>
</body>
</html>
